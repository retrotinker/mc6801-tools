name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the regression tests
        run: make check
      - name: Keep the test outputs if they differ
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-outputs
          path: tests/out/
